<main class="board-container">
  <app-header
    [currentProject]="currentProject"
    [syncState]="syncState"
    [isDarkMode]="isDarkMode"
    (themeToggled)="themeToggled.emit()"
    (statusChanged)="statusChanged.emit($event)"
  ></app-header>

  <app-board
    [currentProject]="currentProject"
    (stateChanged)="boardChanged.emit()"
    (taskOpened)="taskOpened.emit($event)"
    (taskDeleted)="taskDeleted.emit($event)"
  ></app-board>
</main>
