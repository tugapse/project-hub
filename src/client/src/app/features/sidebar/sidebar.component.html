<div class="sidebar-content" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="sidebar-links">
      <a class="sidebar-link" href="#" (click)="selectTab('active', $event)"
        [class.active]="selectedTab === 'active'">Active</a>
      /
      <a class="sidebar-link" href="#" (click)="selectTab('archived', $event)"
        [class.active]="selectedTab === 'archived'">Archived</a>
    </div>
    <h2>Projects</h2>
  </div>
  <div class="project-list" cdkDropListGroup>
    @for (group of groups; track group.status) {
      @if (group.label && group.projects.length > 0) {
        <div class="group-header">{{ group.label }}</div>
      }
      <div
        class="project-group"
        [class.empty]="group.projects.length === 0"
        cdkDropList
        [cdkDropListData]="group.projects"
        (cdkDropListDropped)="drop($event, group.status)"
      >
        @for (p of group.projects; track p.id) {
          <div
            cdkDrag
            [cdkDragData]="p"
            (click)="selectProject(p)"
            [class.active]="currentProject?.id === p.id"
            class="project-item"
            [class.not-started]="p.status === 'not_started'"
          >
            <div class="project-item-header">
              <app-project-status-icon [status]="p.status" />
              @if (p.id !== currentProject?.id) {
                <span class="project-name">{{ p.name }}</span>
              } @else {
                <input
                  class="proj-edit-input"
                  type="text"
                  [(ngModel)]="p.name"
                  (blur)="updateProject()"
                  (keyup.enter)="$any($event.target).blur()"
                  placeholder="Project Name"
                />
                <button (click)="deleteProject(p, $event)" class="delete-proj-btn">&times;</button>
              }
            </div>
            @if (p.status !== 'not_started') {
              <div class="progress-bar-container">
                <div class="progress-segment todo" [style.width.%]="calculateProgress(p)['todo']"></div>
                <div class="progress-segment doing" [style.width.%]="calculateProgress(p)['doing']"></div>
                <div class="progress-segment done" [style.width.%]="calculateProgress(p)['done']"></div>
              </div>
            }
          </div>
        }
      </div>
    }
  </div>
  <div class="sidebar-footer">
    <input
      class="add-proj-input"
      type="text"
      [(ngModel)]="newProjectName"
      (keyup.enter)="addProject()"
      placeholder="Add new project..."
    />
    <button class="add-proj-btn" (click)="addProject()">+</button>
  </div>
</div>
