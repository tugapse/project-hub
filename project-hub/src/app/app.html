<div class="app-wrapper">
      <app-sidebar
        [projects]="projects"
        [currentProject]="currentProject"
        (projectSelected)="handleProjectSelected($event)"
        (projectAdded)="handleProjectAdded($event)"
        (projectDeleted)="handleProjectDeleted($event)"
        (projectUpdated)="handleProjectUpdated()"
      ></app-sidebar>

      <app-main-view
        *ngIf="currentProject"
        [currentProject]="currentProject"
        [isSyncing]="isSyncing"
        [isDarkMode]="isDarkMode"
        (themeToggled)="toggleTheme()"
        (stateChanged)="save()"
        (taskOpened)="openTaskPopup($event)"
        (taskDeleted)="deleteTask($event.column, $event.task)"
      ></app-main-view>

    <task-modal
      [showPopup]="showPopup"
      [editingTask]="editingTask"
      (close)="handleModalClosed()"
      (update)="handleTaskUpdate($event)"
    ></task-modal>
    </div>
