<header>
  <div class="header-left">
    <div class="header-top-row">
      <ng-container *ngIf="currentProject">
        <h1>{{ currentProject.name }}</h1>
      </ng-container>
      <div class="archive-toggle">
        <span class="archive-toggle-label">{{ isProjectArchived ? 'Set to Active' : 'Archive Project' }}</span>
        <label class="archive-toggle-switch">
          <input type="checkbox" [checked]="isProjectArchived" (change)="onToggleProjectState()">
          <span class="archive-toggle-slider"></span>
        </label>
      </div>
    </div>
    <div class="status-pill" *ngIf="syncState" [ngClass]="syncState" [title]="syncState === 'error' ? 'An error occurred during sync' : null">
      <span class="dot"></span>
      <ng-container [ngSwitch]="syncState">
        <span *ngSwitchCase="'syncing'">Syncing...</span>
        <span *ngSwitchCase="'synced'">System Synced</span>
        <span *ngSwitchCase="'error'">Sync Error</span>
        <span *ngSwitchDefault>System Synced</span>
      </ng-container>
    </div>
  </div>
  <div class="header-right">
    <button (click)="onToggleTheme()" class="theme-toggle">
      {{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}
    </button>
  </div>
</header>
